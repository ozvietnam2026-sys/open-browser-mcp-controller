# One-click Render Docker deploy for full Playwright (pw_* / ai_* / video / mail file).
# Dashboard: New → Blueprint → connect this repo → apply.
# Free web service sleeps after ~15 minutes idle (cold start ~1 min).

services:
  - type: web
    name: open-browser-mcp-controller
    runtime: docker
    plan: free
    healthCheckPath: /api/extract/health
    envVars:
      - key: ENABLE_PLAYWRIGHT
        value: "1"
      - key: NODE_ENV
        value: production
      - key: OBMC_PROFILE
        value: full
      - key: MAIL_PERSIST_PATH
        value: /tmp/obmc/mailbox.json
      - key: OBMC_CHANGE_STORE
        value: /tmp/obmc/change-store.json
      - key: OBMC_OUTPUT_DIR
        value: /tmp/obmc/output
      - key: OBMC_DOWNLOAD_DIR
        value: /tmp/obmc/downloads
      - key: OBMC_STEALTHISH
        value: "1"
      - key: OBMC_VIDEO
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional — paste in Render dashboard (do not commit secrets):
      # GEMINI_API_KEY, TAVILY_API_KEY, JINA_API_KEY,
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
